{% extends 'cuentas/base.html' %}
{% block contenido %}
<h1>Crear registro</h1>
{% if error %}<p class="aviso">{{ error }}</p>{% endif %}

<form method="post">
    {% csrf_token %}
    <label>Titulo</label>
    <input type="text" name="titulo" maxlength="100" required>

    <label>Descripcion</label>
    <textarea name="descripcion" rows="4"></textarea>

    <label>Propietario (usuario que podra editarlo)</label>
    <select name="propietario" required>
        {% for usuario in usuarios %}
            <option value="{{ usuario.id }}">{{ usuario.username }}</option>
        {% endfor %}
    </select>
    <button type="submit">Guardar</button>
</form>
<a href="{% url 'lista' %}">Volver</a>
{% endblock %}
