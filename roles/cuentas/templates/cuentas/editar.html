{% extends 'cuentas/base.html' %}
{% block contenido %}
<h1>Editar registro</h1>
{% if error %}<p class="aviso">{{ error }}</p>{% endif %}

<form method="post">
    {% csrf_token %}
    <label>Titulo</label>
    <input type="text" name="titulo" value="{{ registro.titulo }}" maxlength="100" required>

    <label>Descripcion</label>
    <textarea name="descripcion" rows="4">{{ registro.descripcion }}</textarea>
    <button type="submit">Guardar cambios</button>
</form>
<a href="{% url 'lista' %}">Volver</a>
{% endblock %}
